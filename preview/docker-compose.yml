# Local preview of UDSM CyberRange: the official GZCTF v1.9.1 image, PostgreSQL, the
# CyberRange service, and Caddy in front of both on http://localhost:3000.
# Start:  docker compose up -d --build   (run from this folder)
# Stop:   docker compose down            (add -v to also wipe the database and uploads)
# Secrets and test logins live in .env next to this file (copy .env.example to start).

name: gzctf-preview

services:
  gzctf:
    # Same version as the source in this repository, so the web interface built from it matches
    image: gztime/gzctf:v1.9.1
    restart: unless-stopped
    environment:
      LC_ALL: en_US.UTF-8
      # Creates the "Admin" account on first start
      GZCTF_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GZCTF_XorKey: ${XOR_KEY}
      GZCTF_ConnectionStrings__Database: "Host=db:5432;Database=gzctf;Username=postgres;Password=${POSTGRES_PASSWORD}"
      # Address players use to reach challenge containers. Not "localhost": Docker Desktop
      # resets these connections over IPv6, which is what localhost resolves to first.
      # On a real server this is its public IP or domain name.
      GZCTF_ContainerProvider__PublicEntry: 127.0.0.1
      # Largest upload accepted, in bytes (1 GiB). The default of about 28 MB is too
      # small for disk images and packet captures.
      GZCTF_Kestrel__Limits__MaxRequestBodySize: 1073741824
      # Visitors arrive through the proxy below. Trust the visitor address it passes on,
      # from this network only, so rate limits and logs see real visitors, not the proxy.
      GZCTF_ForwardedOptions__ForwardedHeaders: "XForwardedFor,XForwardedProto"
      GZCTF_ForwardedOptions__TrustedNetworks__0: 172.29.0.0/24
    volumes:
      - gzctf-files:/app/files
      # Web interface built from ../src (run `pnpm build` in src/GZCTF/ClientApp, then
      # restart this service). Remove this line to go back to the image's stock interface.
      - ../src/GZCTF/ClientApp/build:/app/wwwroot:ro
      # Lets the platform start and stop challenge containers; it will not run without it
      - /var/run/docker.sock:/var/run/docker.sock
    # The image's own check only allows 10s to start and then waits 5 minutes,
    # so a normal ~30s startup shows as "unhealthy" for a while.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 90s
      retries: 3
    networks:
      - default
      - challenges-open
      - challenges-isolated
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gzctf-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Adds CPU and process limits to every challenge instance, which GZCTF itself only
  # memory-limits on Linux (see instance-limits.sh). Without this, a player with a shell
  # in their instance could run a CPU-burning loop and slow the platform for everyone.
  instance-limits:
    image: docker:29-cli
    restart: unless-stopped
    entrypoint: ["sh", "/instance-limits.sh"]
    environment:
      # Most CPU one instance may use, in cores
      INSTANCE_CPUS: "0.5"
      # Priority when the machine is busy (Docker's default is 1024), so the platform and
      # its database always get the CPU first
      INSTANCE_CPU_SHARES: "128"
      # Most processes one instance may run; stops fork bombs
      INSTANCE_PIDS: "256"
    volumes:
      - ./instance-limits.sh:/instance-limits.sh:ro
      # Needed to update the instances' limits
      - /var/run/docker.sock:/var/run/docker.sock
    # Talks to Docker through the socket only
    network_mode: none

  # Skill Paths: modules and their questions, students' progress, XP and ranks, and
  # practice machines. Lessons come from ../content; the service from ../services/cyberrange.
  range:
    build: ../services/cyberrange
    image: udsm-cyberrange:local
    restart: unless-stopped
    environment:
      # its own database, created on first start, on the same PostgreSQL server
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/cyberrange"
      GZCTF_URL: http://gzctf:8080
      RANGE_SECRET: ${RANGE_SECRET}
      # platform admins who may hand out roles, by user name or user id, separated by commas
      SUPERADMINS: ${SUPERADMINS:-Admin}
      # address students use to reach their machine; on a real server, its domain or IP
      PUBLIC_ENTRY: 127.0.0.1
      # where the browser tools (CyberChef) are, shown in the attack box; on a real server, a
      # domain of their own such as https://tools.example.org
      TOOLS_URL: http://localhost:3001
      # The attack box (see attack-box/ and the README): how long one runs, and how many may
      # run at once. BOX_MEMORY_MB, BOX_CPUS, BOX_PIDS, BOX_DISK_MB and BOX_FILE_MB limit each.
      BOX_MINUTES: 120
      BOX_SEATS: 40
      # The box's Firefox (see attack-browser/), "off" to turn it off. Each one may use
      # BROWSER_MEMORY_MB and BROWSER_CPUS, and stops after BROWSER_IDLE_MINUTES unwatched.
      # Burp Suite runs next to it once its window is opened, adding BURP_MEMORY_MB and
      # BURP_CPUS; "off" turns Burp off too.
      BOX_BROWSER: "on"
    volumes:
      - ../content:/content:ro
      # starts and stops the practice machines and the attack boxes
      - /var/run/docker.sock:/var/run/docker.sock
      # the approved packages for attack boxes (see mirror.mjs); mounted here only so that
      # compose creates the volume, which every box then reads
      - box-mirror:/mirror:ro
    depends_on:
      db:
        condition: service_healthy

  # Tools that run in the student's browser, CyberChef first, on an address of their own so
  # that nothing they show can act on the platform with a student's sign-in.
  tools:
    build: ./tools
    image: udsm-tools:local
    restart: unless-stopped
    ports:
      # http://localhost:3001, reachable from this machine only
      - "127.0.0.1:3001:80"

  # The attack box's Firefox reaches the web through this proxy and in no other way: websites
  # over http and https, never this server, its networks or other students' machines (see
  # ../services/egress). It notes which student's browser asked for which site.
  egress:
    build: ../services/egress
    image: udsm-egress:local
    restart: unless-stopped
    environment:
      # addresses to refuse besides the private ones, separated by commas: on a real server,
      # its own public IP
      EGRESS_DENY: ""
    networks:
      - browsers
      - egress-out

  # The front door: /api/range goes to the CyberRange service, everything else to the platform.
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      # http://localhost:3000, reachable from this machine only.
      # Change to "3000:80" to let other devices on your network open it.
      - "127.0.0.1:3000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - gzctf
      - range

volumes:
  gzctf-files:
  gzctf-db:
  box-mirror:
    name: cyberrange-mirror

# Networks for challenge instances. GZCTF creates these itself when they are missing,
# but then every instance can reach every other one, so a player who gets a shell in
# their own instance could attack a classmate's. Creating them here first, with
# enable_icc off, blocks traffic between instances. Players still reach their own
# instance through its published port.
networks:
  # The services' own network, with a fixed address range so GZCTF can trust the proxy
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
  challenges-open:
    name: gzctf-open
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  # For challenges set to the "Isolated" network mode: also no internet access
  challenges-isolated:
    name: gzctf-isolated
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # The attack box browsers and their proxy. Nothing on it reaches the internet or this server
  # by itself (no gateway address on the server); the proxy is the only way out.
  browsers:
    name: cyberrange-browsers
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  # the proxy's own way to the internet
  egress-out:
    name: cyberrange-egress-out
