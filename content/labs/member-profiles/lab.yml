title: "Member Profiles"
summary: "Every member has a profile page. The president keeps a private note on theirs."
scenario: |
  Every club member has a profile page, and you are logged in as a guest. The club president keeps a private note on their profile, which only they should be able to read.

  Start the machine and read it.
