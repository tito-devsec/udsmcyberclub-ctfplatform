title: "License Key"
summary: "The trial is over, but the key check runs in your own browser."
scenario: |
  The club's copy of SOC Simulator stopped at the end of its trial and asks for a license key. Nobody has one.

  Start the machine and open it. The key is checked by JavaScript in the page, so everything the check needs is already in your browser.
category: reverse
difficulty: easy
minutes: 25
icon: key
updated: "2026-11-12"
order: 420
