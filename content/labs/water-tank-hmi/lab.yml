title: "Water Tank HMI"
summary: "The HMI keeps the chlorine dose safe. Does the plant?"
scenario: |
  The treatment plant's new web HMI sets the chlorine dose of tank 2. Its slider stops at 5 mg/l and a script in the page refuses anything higher, so the operators trust it to keep the dose safe. Above 10 mg/l the plant's own safety system sounds the alarm.

  Start the machine and find out whether the plant itself checks the dose, or only the page does. The incident report holds the flag.
category: ics
difficulty: easy
minutes: 20
icon: faucet
updated: "2026-11-12"
