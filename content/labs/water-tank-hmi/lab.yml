  - id: where
    question: "Where must a safety limit be enforced so that no screen can get around it?"
    answer: ["plc", "the plc", "in the plc", "controller", "the controller", "in the controller", "server", "the server", "server side", "server-side", "on the server"]
    hint: "Not in the HMI."
