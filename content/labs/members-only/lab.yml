title: "Members Only"
summary: "The members area is for admins only, and the site has decided you are a guest."
scenario: |
  The club's members area is for admins only. The site remembers who you are between visits, and it has decided you are a guest.

  Start the machine, find out where that decision is kept, and change it.
category: web
difficulty: easy
minutes: 20
icon: cookie
updated: "2026-11-12"
order: 40
