title: Broken Access Control
summary: Pages that hand over data or files without checking who is asking, or what they are asking for.
description: |
  Access control is the set of checks that decide who may see what. When one is missing, the
  attack is often no more than changing a number or a file name in the address bar. This
  module covers the two classics: IDOR and path traversal.

  **You will learn to**

  - recognise record IDs in addresses and test the ones next to yours
  - climb out of a folder with `../` when a page opens files by name
  - explain the check the server should have made in each case

  Do Web Fundamentals first if HTTP requests are new to you.
category: web
difficulty: medium
minutes: 45
icon: shield-keyhole
updated: "2026-11-12"
order: 30
chapters:
  - title: IDOR
    sections:
      - title: Objects and who owns them
        file: 01-idor.md
        questions:
          - id: meaning
            question: What does the I at the start of IDOR stand for?
            answer: Insecure
            format: "********"
          - id: category
            question: In which OWASP Top 10 category does IDOR belong?
            answer: Broken Access Control
            format: "****** ****** *******"
      - title: Read the president's note
        file: 02-the-presidents-note.md
        machine:
          image: club/member-profiles:latest
          port: 80
          flag: udsm{check_who_owns_the_object_[USER_HASH]}
        questions:
