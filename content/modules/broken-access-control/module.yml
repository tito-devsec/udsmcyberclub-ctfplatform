            flag: true
            xp: 40
  - title: Path Traversal
    sections:
      - title: Files and folders
        file: 03-files-and-folders.md
        questions:
          - id: parent
            question: Which two characters mean "the folder above" in a path?
            answer: ".."
            format: "**"
          - id: passwd
            question: Which Linux file, listing the system's user accounts, is a classic first target of path traversal?
            answer: [/etc/passwd, etc/passwd]
            format: "/***/******"
      - title: Climb out of the library
        file: 04-climb-out-of-the-library.md
