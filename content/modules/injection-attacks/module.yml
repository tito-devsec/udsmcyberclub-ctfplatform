title: Injection Attacks
summary: What happens when a page pastes what you type into a shell command or a database query.
description: |
  Injection is one mistake with many faces: a program builds a command out of text, some of
  that text comes from a visitor, and the visitor's text ends up being read as part of the
  command. This module shows it against a system shell and against a database.

  **You will learn to**

  - run your own commands through a page that passes input to the shell
  - log in without a password by changing the meaning of an SQL query
  - name the fix for each: argument lists and parameterized queries

  These are the hardest sections of the beginner path. Take your time with the reading.
category: web
difficulty: medium
minutes: 55
icon: syringe
updated: "2026-11-12"
order: 40
