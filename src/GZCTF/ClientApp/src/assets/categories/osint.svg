<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OSINT category badge">
  <defs>
    <linearGradient id="osint-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="osint-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2947"/>
      <stop offset="1" stop-color="#090E1C"/>
    </linearGradient>
    <radialGradient id="osint-glow" gradientUnits="userSpaceOnUse" cx="256" cy="205" r="146">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="osint-ink" gradientUnits="userSpaceOnUse" x1="0" y1="-48" x2="0" y2="48">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="osint-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="osint-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="osint-clip"><polygon points="256,37 445.66,146.5 445.66,365.5 256,475 66.34,365.5 66.34,146.5"/></clipPath>
  </defs>

  <!-- badge -->
  <polygon points="256,50 434.4,153 434.4,359 256,462 77.6,359 77.6,153" fill="url(#osint-rim)" stroke="url(#osint-rim)" stroke-width="24" stroke-linejoin="round"/>
  <polygon points="256,68 418.81,162 418.81,350 256,444 93.19,350 93.19,162" fill="url(#osint-plate)" stroke="url(#osint-plate)" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="256" cy="205" r="146" fill="url(#osint-glow)"/>
  <polygon points="256,84 404.96,170 404.96,342 256,428 107.04,342 107.04,170" fill="none" stroke="#C4B5FD" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#C4B5FD"><circle cx="256" cy="84" r="4"/><circle cx="404.96" cy="170" r="4"/><circle cx="404.96" cy="342" r="4"/><circle cx="256" cy="428" r="4"/><circle cx="107.04" cy="342" r="4"/><circle cx="107.04" cy="170" r="4"/></g>

  <!-- icon -->
  <g transform="translate(256 205) scale(1.78)" fill="none" stroke="url(#osint-ink)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-46 -26V-40H-32M46 -26V-40H32M-46 26V40H-32M46 26V40H32"/>
      <path d="M-38 0C-24 -19 -11 -24 0 -24C11 -24 24 -19 38 0C24 19 11 24 0 24C-11 24 -24 19 -38 0Z"/>
      <circle r="11"/>
      <circle r="4" fill="url(#osint-ink)" stroke="none"/>
  </g>

  <!-- ribbon -->
  <rect x="34" y="398" width="444" height="14" fill="url(#osint-shade)" clip-path="url(#osint-clip)"/>
  <path d="M8 350H56V412H8L22 381Z" fill="#6D28D9"/>
  <path d="M504 350H456V412H504L490 381Z" fill="#6D28D9"/>
  <path d="M34 398H56V412Z" fill="#3F177E"/>
  <path d="M478 398H456V412Z" fill="#3F177E"/>
  <rect x="34" y="336" width="444" height="62" fill="url(#osint-ribbon)"/>
  <path d="M34 342.5H478M34 391.5H478" stroke="#0B1220" stroke-opacity="0.22" stroke-width="1.5"/>
  <text x="258" y="377.5" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="4" fill="#0B1220">OSINT</text>
</svg>
