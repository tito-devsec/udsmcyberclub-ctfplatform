  <polygon points="256,84 404.96,170 404.96,342 256,428 107.04,342 107.04,170" fill="none" stroke="#93C5FD" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#93C5FD"><circle cx="256" cy="84" r="4"/><circle cx="404.96" cy="170" r="4"/><circle cx="404.96" cy="342" r="4"/><circle cx="256" cy="428" r="4"/><circle cx="107.04" cy="342" r="4"/><circle cx="107.04" cy="170" r="4"/></g>

  <!-- icon -->
  <g transform="translate(256 205) scale(1.78)" fill="none" stroke="url(#web-ink)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <circle r="42"/>
