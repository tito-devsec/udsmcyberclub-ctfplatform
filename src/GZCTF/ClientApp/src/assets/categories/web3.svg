<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Web3 category badge">
  <defs>
    <linearGradient id="web3-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0ABFC"/>
      <stop offset="0.5" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#A21CAF"/>
    </linearGradient>
    <linearGradient id="web3-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2947"/>
      <stop offset="1" stop-color="#090E1C"/>
    </linearGradient>
    <radialGradient id="web3-glow" gradientUnits="userSpaceOnUse" cx="256" cy="205" r="146">
      <stop offset="0" stop-color="#D946EF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="web3-ink" gradientUnits="userSpaceOnUse" x1="0" y1="-48" x2="0" y2="48">
