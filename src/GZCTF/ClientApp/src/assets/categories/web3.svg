        <circle cx="32.9" cy="19" r="6"/>
        <circle cy="38" r="6"/>
        <circle cx="-32.9" cy="19" r="6"/>
        <circle cx="-32.9" cy="-19" r="6"/>
        <circle r="6"/>
      </g>
  </g>

  <!-- ribbon -->
  <rect x="34" y="398" width="444" height="14" fill="url(#web3-shade)" clip-path="url(#web3-clip)"/>
  <path d="M8 350H56V412H8L22 381Z" fill="#A21CAF"/>
  <path d="M504 350H456V412H504L490 381Z" fill="#A21CAF"/>
  <path d="M34 398H56V412Z" fill="#5E1066"/>
  <path d="M478 398H456V412Z" fill="#5E1066"/>
  <rect x="34" y="336" width="444" height="62" fill="url(#web3-ribbon)"/>
  <path d="M34 342.5H478M34 391.5H478" stroke="#0B1220" stroke-opacity="0.22" stroke-width="1.5"/>
  <text x="258" y="377.5" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="4" fill="#0B1220">WEB3</text>
