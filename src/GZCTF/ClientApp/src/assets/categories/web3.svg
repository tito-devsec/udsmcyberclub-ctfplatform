    </linearGradient>
    <linearGradient id="web3-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D946EF"/>
      <stop offset="0.5" stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="web3-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="web3-clip"><polygon points="256,37 445.66,146.5 445.66,365.5 256,475 66.34,365.5 66.34,146.5"/></clipPath>
  </defs>

  <!-- badge -->
  <polygon points="256,50 434.4,153 434.4,359 256,462 77.6,359 77.6,153" fill="url(#web3-rim)" stroke="url(#web3-rim)" stroke-width="24" stroke-linejoin="round"/>
  <polygon points="256,68 418.81,162 418.81,350 256,444 93.19,350 93.19,162" fill="url(#web3-plate)" stroke="url(#web3-plate)" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="256" cy="205" r="146" fill="url(#web3-glow)"/>
  <polygon points="256,84 404.96,170 404.96,342 256,428 107.04,342 107.04,170" fill="none" stroke="#F0ABFC" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#F0ABFC"><circle cx="256" cy="84" r="4"/><circle cx="404.96" cy="170" r="4"/><circle cx="404.96" cy="342" r="4"/><circle cx="256" cy="428" r="4"/><circle cx="107.04" cy="342" r="4"/><circle cx="107.04" cy="170" r="4"/></g>

  <!-- icon -->
  <g transform="translate(256 205) scale(1.78)" fill="none" stroke="url(#web3-ink)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -38L32.9 -19V19L0 38L-32.9 19V-19Z"/>
      <path d="M-32.9 -19L0 0L32.9 -19M0 0V38"/>
      <g fill="url(#web3-ink)" stroke="none">
