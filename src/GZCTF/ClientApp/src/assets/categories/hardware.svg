<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hardware category badge">
  <defs>
    <linearGradient id="hardware-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset="0.5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="hardware-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2947"/>
      <stop offset="1" stop-color="#090E1C"/>
    </linearGradient>
    <radialGradient id="hardware-glow" gradientUnits="userSpaceOnUse" cx="256" cy="205" r="146">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hardware-ink" gradientUnits="userSpaceOnUse" x1="0" y1="-48" x2="0" y2="48">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="hardware-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="hardware-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hardware-clip"><polygon points="256,37 445.66,146.5 445.66,365.5 256,475 66.34,365.5 66.34,146.5"/></clipPath>
  </defs>

  <!-- badge -->
  <polygon points="256,50 434.4,153 434.4,359 256,462 77.6,359 77.6,153" fill="url(#hardware-rim)" stroke="url(#hardware-rim)" stroke-width="24" stroke-linejoin="round"/>
  <polygon points="256,68 418.81,162 418.81,350 256,444 93.19,350 93.19,162" fill="url(#hardware-plate)" stroke="url(#hardware-plate)" stroke-width="12" stroke-linejoin="round"/>
  <circle cx="256" cy="205" r="146" fill="url(#hardware-glow)"/>
  <polygon points="256,84 404.96,170 404.96,342 256,428 107.04,342 107.04,170" fill="none" stroke="#86EFAC" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#86EFAC"><circle cx="256" cy="84" r="4"/><circle cx="404.96" cy="170" r="4"/><circle cx="404.96" cy="342" r="4"/><circle cx="256" cy="428" r="4"/><circle cx="107.04" cy="342" r="4"/><circle cx="107.04" cy="170" r="4"/></g>

  <!-- icon -->
  <g transform="translate(256 205) scale(1.78)" fill="none" stroke="url(#hardware-ink)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-24" y="-24" width="48" height="48" rx="6"/>
      <rect x="-10" y="-10" width="20" height="20" rx="2.5"/>
      <path d="M-14 -27V-41M0 -27V-41M14 -27V-41M-14 27V41M0 27V41M14 27V41M-27 -14H-41M-27 0H-41M-27 14H-41M27 -14H41M27 0H41M27 14H41"/>
  </g>

  <!-- ribbon -->
  <rect x="34" y="398" width="444" height="14" fill="url(#hardware-shade)" clip-path="url(#hardware-clip)"/>
  <path d="M8 350H56V412H8L22 381Z" fill="#15803D"/>
  <path d="M504 350H456V412H504L490 381Z" fill="#15803D"/>
  <path d="M34 398H56V412Z" fill="#0C4A23"/>
  <path d="M478 398H456V412Z" fill="#0C4A23"/>
  <rect x="34" y="336" width="444" height="62" fill="url(#hardware-ribbon)"/>
  <path d="M34 342.5H478M34 391.5H478" stroke="#0B1220" stroke-opacity="0.22" stroke-width="1.5"/>
  <text x="258" y="377.5" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="4" fill="#0B1220">HARDWARE</text>
</svg>
