<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ICS category badge">
  <defs>
    <linearGradient id="ics-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BEF264"/>
      <stop offset="0.5" stop-color="#84CC16"/>
      <stop offset="1" stop-color="#4D7C0F"/>
    </linearGradient>
    <linearGradient id="ics-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2947"/>
      <stop offset="1" stop-color="#090E1C"/>
    </linearGradient>
    <radialGradient id="ics-glow" gradientUnits="userSpaceOnUse" cx="256" cy="205" r="146">
      <stop offset="0" stop-color="#84CC16" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#84CC16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ics-ink" gradientUnits="userSpaceOnUse" x1="0" y1="-48" x2="0" y2="48">
