          <rect x="-6" y="10" width="10" height="10" rx="2"/>
          <rect x="14" y="10" width="10" height="10" rx="2"/>
          <circle cx="-33" cy="-41" r="3.5"/>
          <circle cx="-23" cy="-47" r="2.5"/>
        </g>
      </g>
  </g>

  <!-- ribbon -->
  <rect x="34" y="398" width="444" height="14" fill="url(#ics-shade)" clip-path="url(#ics-clip)"/>
  <path d="M8 350H56V412H8L22 381Z" fill="#4D7C0F"/>
  <path d="M504 350H456V412H504L490 381Z" fill="#4D7C0F"/>
  <path d="M34 398H56V412Z" fill="#2D4809"/>
  <path d="M478 398H456V412Z" fill="#2D4809"/>
