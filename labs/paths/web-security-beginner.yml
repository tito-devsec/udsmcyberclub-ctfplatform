title: Web Security Beginner
summary: How websites work, and the classic mistakes that let attackers in. Every lab ends on a machine of your own.
description: |
  Start here if you are new to web security. Each lab teaches one idea in a few minutes of
  reading, then gives you your own machine where you use it to find a flag.
  Finish a lab to open the next one.

  Only ever test systems you own or have written permission to test. The lab machines are
  yours: attack them as much as you like.
level: beginner
order: 10
modules:
  - title: How the web works
    summary: Requests, responses, and what a site tells you when you look closer.
    labs: [web-requests, hidden-pages]
  - title: Never trust the client
    summary: Headers, cookies and form fields all come from the visitor, who can change them.
    labs: [request-headers, cookies, hidden-form-fields]
  - title: Broken access control
    summary: Pages that hand out data without checking who is asking.
    labs: [idor, path-traversal]
  - title: Injection
    summary: When what a visitor types turns into commands.
    labs: [command-injection, sql-injection]
