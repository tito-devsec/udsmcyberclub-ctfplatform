title: How the Web Works
summary: Requests, responses, and the page source your browser does not show you.
difficulty: easy
minutes: 20
machine:
  image: club/staff-portal:latest
  port: 80
  flag: udsm{always_check_the_source_[USER_HASH]}
tasks:
  - title: Requests and responses
    file: 1-requests.md
    questions:
      - id: method
        question: Which HTTP method does a browser use to load a page?
        answer: GET
        format: "***"
      - id: not-found
        question: Which status code means that the page does not exist?
        answer: "404"
        format: "***"
  - title: What the browser does not show
    file: 2-source.md
    questions:
      - id: comment
        question: Which four characters start a comment in HTML?
        answer: "<!--"
        format: "****"
      - id: flag
        question: Start your machine. What is the flag hidden in the Staff Portal's page source?
        flag: true
