title: Command Injection
summary: When a page passes what you type to the system's shell.
difficulty: medium
minutes: 25
machine:
  image: club/ping-tool:latest
  port: 80
  flag: udsm{never_trust_user_input_[USER_HASH]}
tasks:
  - title: When input becomes a command
    file: 1-injection.md
    questions:
      - id: separator
        question: Which character ends one shell command so another can start on the same line?
        answer: ";"
        format: "*"
      - id: whoami
        question: Which Linux command prints the name of the current user?
        answer: whoami
        format: "******"
  - title: Ping more than an address
    file: 2-ping.md
    questions:
      - id: user
        question: Which user does the Ping Tool run commands as?
        answer: root
        format: "****"
      - id: flag
        question: What is the flag in /flag.txt?
        flag: true
