title: Recon with robots.txt
summary: Find the pages a website asks search engines to stay away from.
difficulty: easy
minutes: 15
machine:
  image: club/hidden-pages:latest
  port: 80
  flag: udsm{robots_txt_is_public_[USER_HASH]}
tasks:
  - title: How search engines read a site
    file: 1-robots.md
    questions:
      - id: file-name
        question: What is the name of the file where a site lists what search engines should skip?
        answer: [robots.txt, /robots.txt]
        format: "******.***"
      - id: directive
        question: Which word in that file marks a path that crawlers should not visit?
        answer: Disallow
        format: "********"
  - title: Find the hidden page
    file: 2-find.md
    questions:
      - id: hidden-path
        question: Which path does your machine's robots.txt hide?
        answer: [/staff-notes/, /staff-notes, staff-notes, staff-notes/]
        format: "/***********/"
      - id: flag
        question: What is the flag on the hidden page?
        flag: true
